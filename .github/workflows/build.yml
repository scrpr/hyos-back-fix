name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install Android SDK and NDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
      - name: Prepare release signing
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hyos-release.keystore"
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/hyos-release.keystore" >> "$GITHUB_ENV"
          fi
      - name: Build debug and release APKs
        env:
          SIGNING_STORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.SIGNING_STORE_PASSWORD || '' }}
          SIGNING_KEY_ALIAS: ${{ github.event_name != 'pull_request' && secrets.SIGNING_KEY_ALIAS || '' }}
          SIGNING_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.SIGNING_KEY_PASSWORD || '' }}
        run: ./gradlew --no-daemon assembleDebug assembleRelease
      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/hyos-back-fix-debug.apk
          for apk in app/build/outputs/apk/release/*.apk; do
            cp "$apk" "dist/hyos-back-fix-${apk##*/}"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: hyos-back-fix-${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: error
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/hyos-release.keystore"
